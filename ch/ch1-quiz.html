<style>

@media(max-width:520px){.wrap{padding:26px 13px 100px}h1{font-size:1.35rem}.tag{display:none}}

<script>
const Q=[
// ===== 하 (1~15) =====
{lv:"h",tag:"1.1 반도체 정의",q:"반도체를 도체·부도체와 구분하는 가장 본질적인 특징은?",
 o:["전도도가 하나의 값이 아니라 범위를 가지며 도핑으로 조절할 수 있다","전도도가 항상 도체와 부도체의 중간값으로 고정되어 있다","상온에서 전류가 전혀 흐르지 않는다","금속처럼 자유전자만으로 전류가 흐른다"],
 a:0,e:"슬라이드 4쪽의 핵심 문장이다. 도체와 부도체는 <b>전도도 값</b>을 갖지만 반도체는 <b>전도도 범위</b>를 갖는다. 도핑으로 그 안에서 값을 고를 수 있어서 스위치를 만들 수 있고, 그게 반도체를 쓰는 이유다."},
{lv:"h",tag:"1.1 재료 분류",q:"다음 중 <b>단원소(elemental) 반도체</b>가 아닌 것은?",
 o:["Si (실리콘)","GaAs (갈륨비소)","C (다이아몬드)","Ge (저마늄)"],
 a:1,e:"단원소 반도체는 <b>한 종류의 원자</b>로만 이루어진 4족 물질이다. Si, Ge, 다이아몬드(C)가 여기 해당한다. GaAs는 Ga(3족)와 As(5족) 둘로 이루어진 <b>화합물(compound) 반도체</b>, 그중에서도 원소가 둘이라 <b>binary(이원계)</b>다."},
{lv:"h",tag:"1.1 화합물 반도체",q:"GaAs가 LED·레이저 같은 <b>광소자</b>에 주로 쓰이는 이유는?",
 o:["Si보다 값이 싸기 때문","녹는점이 높아 열에 강하기 때문","direct bandgap 물질이라 빛을 잘 내기 때문","산화막이 잘 자라기 때문"],
 a:2,e:"GaAs는 전도띠 최저점과 가전자띠 최고점이 <b>같은 k</b>에 있는 direct bandgap 물질이라, 전자가 떨어질 때 모멘텀 변화 없이 곧바로 광자를 낸다. Si는 indirect라 빛 대신 열로 빠져서 LED에 부적합하다. 값은 오히려 Si가 훨씬 싸다."},
{lv:"h",tag:"1.2 고체 분류",q:"결정성(crystallinity)에 따른 고체 세 가지를 <b>규칙적으로 배열된 영역이 작은 것부터</b> 나열하면?",
 o:["단결정 → 다결정 → 비정질","비정질 → 단결정 → 다결정","다결정 → 비정질 → 단결정","비정질 → 다결정 → 단결정"],
 a:3,e:"<b>비정질(amorphous)</b>은 원자 몇 개 수준에서만 규칙이 있고, <b>다결정(polycrystalline)</b>은 규칙적인 덩어리(grain)들이 모여 있으며, <b>단결정(single crystal)</b>은 전체가 하나의 규칙으로 이어진다. 규칙이 이어지는 범위가 곧 순서다."},
{lv:"h",tag:"1.3 격자",q:"<b>lattice(격자)</b>의 정의로 옳은 것은?",
 o:["결정 안에서 원자가 주기적으로 배열된 것","결정을 이루는 원자 하나","결정을 자른 가상의 평면","결정의 표면에 생긴 결함"],
 a:0,e:"lattice는 <b>주기성(periodicity)</b> 그 자체다. 같은 원자 배열이 규칙적으로 반복되는 것이고, 그 반복의 기준점들을 lattice point라 부른다. 가상의 평면은 crystal plane, 결함은 defect다."},
{lv:"h",tag:"1.3 단위격자",q:"<b>unit cell</b>과 <b>primitive cell</b>의 관계로 옳은 것은?",
 o:["둘은 완전히 같은 말이다","primitive cell은 가장 작은 unit cell이다","unit cell이 primitive cell보다 항상 작다","primitive cell은 항상 정육면체다"],
 a:1,e:"unit cell은 <b>반복하면 결정 전체를 만들 수 있는 최소 단위</b>인데, 그런 단위를 잡는 방법은 여러 가지다. 그중 <b>부피가 가장 작은 것</b>이 primitive cell이다. 계산 편의상 primitive가 아닌 unit cell(예: FCC의 정육면체)을 더 자주 쓴다."},
{lv:"h",tag:"1.3 구조별 원자수",q:"<b>단순입방(SC)</b> 구조의 단위격자당 원자 수는?",
 o:["4개","2개","1개","8개"],
 a:2,e:"꼭짓점 8개에 원자가 하나씩 있는데, 각 꼭짓점은 이웃한 큐브 <b>8개가 나눠 갖는다.</b> 따라서 <code>8 × 1/8 = 1</code>개다. 아파트 여덟 집이 기둥 하나를 나눠 갖는 것과 같다."},
{lv:"h",tag:"1.3 구조별 원자수",q:"<b>체심입방(BCC)</b> 구조의 단위격자당 원자 수는?",
 o:["1개","8개","4개","2개"],
 a:3,e:"꼭짓점 몫 <code>8 × 1/8 = 1</code>에, 정중앙(body center)에 온전히 들어 있는 원자 1개를 더해 <b>2개</b>다. body center 원자는 다른 큐브와 나눠 갖지 않으므로 통째로 1로 센다."},
{lv:"h",tag:"1.3 구조별 원자수",q:"<b>면심입방(FCC)</b> 구조의 단위격자당 원자 수는?",
 o:["4개","2개","1개","8개"],
 a:0,e:"꼭짓점 <code>8 × 1/8 = 1</code>에, 여섯 면의 중심 원자가 각각 이웃 큐브 <b>2개와 반씩 나눠</b> 갖는 <code>6 × 1/2 = 3</code>을 더해 <b>4개</b>다."},
{lv:"h",tag:"1.4 다이아몬드 구조",q:"실리콘이 갖는 <b>다이아몬드 구조</b>의 단위격자당 원자 수는?",
 o:["2개","8개","4개","12개"],
 a:1,e:"다이아몬드 구조는 <b>FCC 격자(4개)에 내부 원자 4개가 더 박힌</b> 형태라 총 <b>8개</b>다. 내부 4개는 다른 큐브와 나눠 갖지 않으니 그대로 4로 센다. 판서의 <code>FCC + 4 = 8</code>이 이 뜻이다."},
{lv:"h",tag:"1.4 결합 구조",q:"다이아몬드 구조에서 원자 하나는 몇 개의 최근접 원자와 결합하는가?",
 o:["2개","3개","4개 (정사면체 배치)","6개"],
 a:2,e:"각 원자가 <b>4개의 최근접 원자</b>와 결합하며, 그 배치가 정사면체(tetrahedral) 모양이다. 실리콘의 최외각 전자가 4개인 것과 정확히 맞물린다. 네 방향으로 하나씩 공유결합을 만든다."},
{lv:"h",tag:"1.5 결합",q:"다음 결합 중 <b>가장 약한</b> 것은?",
 o:["이온 결합 (ionic)","공유 결합 (covalent)","금속 결합 (metallic)","반데르발스 결합 (van der Waals)"],
 a:3,e:"<b>반데르발스 결합</b>이 가장 약하다. 전자를 주고받거나 공유하는 것이 아니라 <b>작은 전기 쌍극자끼리의 약한 끌림</b>이기 때문이다. 그래서 이 결합으로 이루어진 물질은 녹는점이 낮고 무르다."},
{lv:"h",tag:"1.5 결합",q:"NaCl(소금)의 결합 방식과 그 원리로 옳은 것은?",
 o:["이온 결합 — 쿨롱 힘에 의한 인력","공유 결합 — 최외각 전자를 서로 공유","금속 결합 — 자유전자의 바다","반데르발스 결합 — 쌍극자 상호작용"],
 a:0,e:"Na가 전자를 내주고 Cl이 받아 각각 Na⁺, Cl⁻ 이온이 되고, <b>+와 −가 쿨롱 힘으로 끌어당겨</b> 결합한다. 이 강한 정전기력 때문에 이온 결정은 녹는점이 높고 단단하지만 잘 부서진다."},
{lv:"h",tag:"1.7 성장",q:"<b>초크랄스키(Czochralski) 법</b>에 대한 설명으로 옳은 것은?",
 o:["기체 상태의 원료를 기판 위에 쌓는다","녹인 실리콘에 씨앗 결정(seed)을 담갔다가 회전시키며 천천히 끌어올린다","고체 실리콘을 잘라서 다듬는다","전기장을 걸어 불순물을 밀어낸다"],
 a:1,e:"이름 그대로 <b>녹은 상태(melt)에서 결정을 키우는</b> 방법이다. 씨앗 결정을 액체 실리콘 표면에 닿게 한 뒤 <b>회전시키면서 천천히 끌어올리면</b> 고체-액체 경계면에서 응고가 일어나며 커다란 단결정 잉곳이 자란다."},
{lv:"h",tag:"1.6 불순물",q:"<b>도핑(doping)</b>을 불순물(impurity)과 구분하는 기준은?",
 o:["원자의 크기가 다르다","결정 표면에만 존재하는가","전기적 성질을 바꾸려고 의도적으로 넣었는가","금속 원소인가 아닌가"],
 a:2,e:"슬라이드 21쪽 구분 그대로다. 외부 원자가 들어온 것은 같지만, <b>의도하지 않은 것(non-intentional)이 impurity</b>이고 <b>의도적으로 넣은 것(intentional)이 doping</b>이다. 목적이 있느냐가 유일한 차이다."},
// ===== 중 (16~30) =====
{lv:"m",tag:"1.1 Why silicon",q:"판서에 적힌 <b>실리콘을 주력으로 쓰는 이유</b> 세 가지에 해당하지 <b>않는</b> 것은?",
 o:["지구상에 풍부해 재료를 구하기 쉽다","밴드갭이 적절한 크기다","SiO₂라는 좋은 절연막을 만들 수 있다","direct bandgap이라 발광 효율이 높다"],
 a:3,e:"판서의 세 가지는 ① 재료가 풍부함 ② 밴드갭이 적절함 ③ <b>SiO₂가 훌륭한 절연체</b>라는 점이다. 마지막이 특히 결정적인데, 산화막을 손쉽게 키울 수 있어야 MOS 소자를 만들 수 있기 때문이다. Si는 <b>indirect</b> bandgap이라 오히려 발광에는 불리하다."},
{lv:"m",tag:"1.3 밀러지수",q:"어떤 면이 세 축을 각각 <code>3a, 2b, 1c</code>에서 자른다. 이 면의 밀러지수는?",
 o:["(2 3 6)","(1 2 3)","(3 2 1)","(6 3 2)"],
 a:0,e:"밀러지수는 <b>절편의 역수</b>를 정수로 만든 것이다.<div class='eq'>(3, 2, 1) → 역수 (1/3, 1/2, 1) → ×6 → <b>(2, 3, 6)</b></div>최소공배수 6을 곱해 분모를 없앤다. 역수를 취하는 이유는 축과 평행한 면(절편 ∞)을 0으로 깔끔하게 표현하기 위해서다."},
{lv:"m",tag:"1.3 밀러지수",q:"세 축의 절편이 각각 <code>1a, 1a, ∞</code>인 면의 밀러지수는?",

{lv:"m",tag:"1.3 등가면",q:"<b>{100} 면족(family of planes)</b>에 속하는 면의 개수는?",

{lv:"m",tag:"1.3 등가면",q:"<b>{110} 면족</b>에 속하는 면의 개수는?",

{lv:"m",tag:"1.3 원자밀도",q:"BCC 구조이고 격자상수가 <code>a = 5 Å = 5×10⁻⁸ cm</code>인 결정의 <b>부피당 원자 밀도</b>는? (교재 예제 1.1)",

{lv:"m",tag:"1.4 원자밀도",q:"실리콘은 다이아몬드 구조이고 격자상수는 <code>a = 5.43 Å</code>이다. 부피당 실리콘 원자 수는?",

 a:1,e:"다이아몬드 구조는 단위격자당 <b>8개</b>다.<div class='eq'>N = 8 / (5.43×10⁻⁸)³ = 8 / (1.60×10⁻²²) ≈ <b>5.0 × 10²² cm⁻³</b></div>이 값(4.99×10²²)은 이 과목에서 계속 나오므로 외워 두는 편이 낫다."},
{lv:"m",tag:"1.4 응용 계산",q:"실리콘의 원자 밀도가 <code>5.0 × 10²² cm⁻³</code>일 때, <b>최외각 전자(valence electron)의 밀도</b>는?",

{lv:"m",tag:"1.2 전기적 성질",q:"판서에 적힌 결정성별 <b>전자 이동도(μ)</b> 크기 순서로 옳은 것은?",

{lv:"m",tag:"1.2 다결정",q:"다결정(polycrystalline) 재료에서 전기적 성질을 나쁘게 만드는 주된 원인은?",
 o:["결정립계(grain boundary)에서의 산란","원자의 종류가 서로 다름","격자상수가 커짐","공유결합이 이온결합으로 바뀜"],

{lv:"m",tag:"1.4 화합물 구조",q:"GaAs처럼 <b>두 종류의 원소</b>가 다이아몬드와 같은 배열을 이룰 때, 이 구조를 무엇이라 부르는가?",

{lv:"m",tag:"1.3 방향지수",q:"단순입방 격자에서 <code>[100]</code> 방향과 <code>(100)</code> 면의 관계는?",

{lv:"m",tag:"1.6 결함",q:"결함의 분류가 <b>잘못</b> 짝지어진 것은?",

{lv:"m",tag:"1.7 에피택시",q:"<b>에피택셜 성장(epitaxial growth)</b>의 정의로 옳은 것은?",
 o:["단결정 기판 위에 얇은 단결정 층을 이어서 키우는 것","녹인 재료에서 잉곳을 끌어올리는 것","웨이퍼를 잘라 칩으로 나누는 것","불순물을 열로 확산시키는 것"],

{lv:"m",tag:"1.4 결정면",q:"실리콘의 (100), (110), (111) 면에서 이동도가 서로 다른 이유는?",
 o:["면마다 격자상수가 다르기 때문","면마다 원자 배열과 밀도가 달라 전자가 느끼는 환경이 다르기 때문","면마다 밴드갭이 다르기 때문","면마다 온도가 다르기 때문"],

{lv:"s",tag:"1.3 APF",q:"<b>단순입방(SC)</b> 구조의 원자 충진율(APF)은? (강체구 접촉 가정)",
 o:["74 %","68 %","52 %","34 %"],

{lv:"s",tag:"1.3 APF",q:"<b>체심입방(BCC)</b> 구조의 원자 충진율(APF)은?",

{lv:"s",tag:"1.3 APF",q:"<b>면심입방(FCC)</b> 구조의 원자 충진율(APF)은?",

{lv:"s",tag:"1.4 APF",q:"실리콘의 <b>다이아몬드 구조</b> 원자 충진율(APF)은?",

{lv:"s",tag:"1.3 면밀도",q:"BCC 구조, <code>a = 5 Å</code>일 때 <b>(110) 면의 단위 면적당 원자 수</b>는? (교재 예제 1.3)",

{lv:"s",tag:"1.3 면밀도 비교",q:"BCC 구조에서 <b>원자 면밀도가 가장 높은 면</b>은? (2024 중간 1-d 기출)",

{lv:"s",tag:"1.4 기하",q:"다이아몬드 구조에서 <b>최근접 원자 사이의 거리</b>를 격자상수 <code>a</code>로 나타내면?",

{lv:"s",tag:"검산 능력",q:"강의자료 12쪽 예제 1.1의 판서 답은 <code>1.6 × 10²³ /cm³</code>이다. 이 값이 맞는지 <b>가장 빠르게 판별하는 방법</b>은?",

{lv:"s",tag:"1.3 역산",q:"어떤 물질이 FCC 구조이고 부피당 원자 밀도가 <code>3.2 × 10²² cm⁻³</code>이다. 격자상수 <code>a</code>는?",
 o:["2.5 Å","5.43 Å","5.0 Å","10.0 Å"],

const list=document.getElementById('list'), K=['①','②','③','④'];
let filter='all', answered={}, correct=0;

function shown(){return Q.map((q,i)=>({q,i})).filter(x=>filter==='all'||x.q.lv===filter);}

function render(){
  const s=shown();
  list.innerHTML=s.map(({q,i})=>{
    const lvName={h:'하',m:'중',s:'상'}[q.lv];
    return `<div class="q" id="q${i}">
      <div class="qh"><span class="num">${i+1}</span>
        <span class="lv ${q.lv}">${lvName}</span>
        <span class="tag">${q.tag}</span></div>
      <p class="stem">${q.q}</p>
      <div class="opts">${q.o.map((o,j)=>
        `<button class="opt" data-q="${i}" data-o="${j}"><span class="k">${K[j]}</span><span>${o}</span></button>`
      ).join('')}</div>
      <div class="ex" id="e${i}"><div class="t"></div><div class="b">${q.e}</div></div>
    </div>`;
  }).join('');
  document.getElementById('tot').textContent=s.length;
  Object.keys(answered).forEach(i=>{if(document.getElementById('q'+i))paint(+i);});
  bind(); prog();
}

function paint(i){
  const pick=answered[i], q=Q[i];
  document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>{
    const j=+b.dataset.o; b.disabled=true;
    if(j===q.a)b.classList.add('ok');
    else if(j===pick)b.classList.add('no');
  });
  const ex=document.getElementById('e'+i);
  const ok=pick===q.a;
  ex.classList.add('show',ok?'ok':'no');
  ex.querySelector('.t').textContent=ok?'정답':`오답 — 정답은 ${K[q.a]}`;
  document.getElementById('q'+i).classList.add('done');
}

function bind(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q; if(i in answered)return;
    answered[i]=+b.dataset.o;
    if(answered[i]===Q[i].a)correct++;
    paint(i); prog();
  });
}

function prog(){
  const s=shown(), done=s.filter(x=>x.i in answered).length;
  const hit=s.filter(x=>answered[x.i]===x.q.a).length;
  document.getElementById('sc').textContent=hit;
  document.getElementById('pg').style.width=(done/s.length*100)+'%';
  const d=document.getElementById('done');
  if(done===s.length&&s.length){
    d.classList.add('show');
    document.getElementById('fsc').textContent=hit;
    document.getElementById('ftot').textContent=s.length;
    const r=hit/s.length;
    document.getElementById('fmsg').textContent =
      r===1?'전부 맞았다. Ch.1은 더 볼 것이 없다.':
      r>=.9?'거의 완벽하다. 틀린 것만 해설 다시 읽으면 끝난다.':
      r>=.75?'기본은 잡혔다. 틀린 문항의 난이도를 보고 그 부분만 보강하면 된다.':
      r>=.5?'개념은 아는데 계산에서 흘리고 있다. 한줄해설의 원자밀도·APF·면밀도 쪽을 다시 볼 것.':
            '강의자료 Ch.1 한줄해설을 한 번 훑고 다시 푸는 편이 빠르다.';
  } else d.classList.remove('show');
}

document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter=b.dataset.f; render();
});
document.getElementById('reset').onclick=()=>{answered={};correct=0;
  document.getElementById('done').classList.remove('show');render();};
render();
</script>
